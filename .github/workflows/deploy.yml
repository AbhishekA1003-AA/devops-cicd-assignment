name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All required website files are present."

      - name: Test completed
        run: echo "CI/CD test stage completed successfully."
